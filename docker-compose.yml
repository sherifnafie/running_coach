services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    # Optional: provider keys and other settings from .env (see .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      OPENCOACH_DATA_DIR: /data
      OPENCOACH_SANDBOX: local
      OPENCOACH_DEMO: ${OPENCOACH_DEMO:-0}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      VIEWS_URL: ${VIEWS_URL:-http://localhost:8081}
      # To use a YAML config, mount it and point OPENCOACH_CONFIG at it, e.g.
      # OPENCOACH_CONFIG: /config/opencoach.yaml
    volumes:
      - ./.data:/data
      # - ./opencoach.config.yaml:/config/opencoach.yaml:ro
    # The trusted server creates nested user/PID namespaces for athlete sandboxes (ADR 0004).
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    restart: unless-stopped
    stop_grace_period: 45s
  sandbox-image:
    profiles: [sandbox-image]
    image: opencoach/sandbox:0.1.0
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
