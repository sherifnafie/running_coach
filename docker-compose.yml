services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      OPENCOACH_DATA_DIR: /data
      OPENCOACH_SANDBOX: local
      OPENCOACH_DEMO: ${OPENCOACH_DEMO:-0}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      VIEWS_URL: ${VIEWS_URL:-http://localhost:8081}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./.data:/data
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    restart: unless-stopped
    stop_grace_period: 45s
  sandbox-image:
    profiles: [sandbox-image]
    image: opencoach/sandbox:0.1.0
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
