name: CI

on:
  push:
    branches: [main, ccr-a500ac00-ytsl89]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Allow unprivileged user namespaces (local sandbox tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for preview/e2e tests
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - name: Install Python libraries used by seed scripts
        run: python3 -m pip install --user --break-system-packages pandas numpy
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build UI kit and web client
        run: pnpm build
      - name: Web client tests
        run: pnpm --filter @opencoach/web test:unit
      - name: Real gateway browser acceptance
        run: pnpm test:e2e
      - name: Offline eval self-test (scripted coach, no API keys)
        run: pnpm eval:selftest
