name: Evals (real models)

# Runs the eval suites against real model providers. Costs money: manual trigger only.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite name or "all"
        default: gates
      model:
        description: Coach model, provider:model
        default: openrouter:deepseek/deepseek-v4.1-flash
      judge:
        description: Judge model, provider:model (different family recommended)
        default: openrouter:openai/gpt-6.1-sol
      seeds:
        description: Seeds per scenario
        default: "3"

jobs:
  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pnpm install --frozen-lockfile
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Run suites
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          SUITE: ${{ inputs.suite }}
          MODEL: ${{ inputs.model }}
          JUDGE: ${{ inputs.judge }}
          SEEDS: ${{ inputs.seeds }}
        run: >
          pnpm --filter @opencoach/evals-sim eval
          --suite "$SUITE" --model "$MODEL" --judge "$JUDGE" --seeds "$SEEDS" --out evals/runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-runs
          path: evals/runs
