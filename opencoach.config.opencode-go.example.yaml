# Copy to an absolute configuration path and set OPENCOACH_CONFIG to that path.
# Supply OPENCODE_GO_API_KEY through your shell or process manager, never YAML.
# Set OPENCOACH_DEMO=0 when starting the server.
# This model has bounded live smoke evidence, not full coaching conformance.
# Official endpoint/model reference: https://opencode.ai/docs/go/
demo: false
providers:
  compatible:
    - id: opencode-go
      baseUrl: https://opencode.ai/zen/go/v1
      apiKeyEnv: OPENCODE_GO_API_KEY
      headers:
        User-Agent: OpenCoach/0.1.0
      sessionHeader: x-opencode-session
      replayReasoningContent: true
      # DeepSeek Chat Completions extensions; explicit thinking was observed live.
      thinking: true
      reasoningEfforts: [low, high, max]
      # Thinking and emitted tool arguments share this output budget.
      maxOutputTokens: 16384
      # This is the text model, not DeepSeek V4 Flash Vision Exp.
      # Image input has not been verified for this integration.
      vision: false
models:
  tiers:
    coach: { provider: opencode-go, model: deepseek-v4.1-flash, effort: low }
    deep: { provider: opencode-go, model: deepseek-v4.1-flash, effort: high }
    fast: { provider: opencode-go, model: deepseek-v4.1-flash, effort: low }
  # GO documents peak/off-peak token-equivalent prices. Use peak rates as a
  # conservative local budget estimate; this is not the provider's billing ledger.
  # USD per 1M tokens, checked 2026-10-06: https://opencode.ai/docs/go/
  pricing:
    deepseek-v4.1-flash:
      inputPerMTok: 0.30
      outputPerMTok: 1.20
      cacheReadPerMTok: 0.006
