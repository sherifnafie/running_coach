<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Today</title>
  <!-- The kit: design tokens + <rc-*> components + window.coach. Always absolute /kit/1/ paths. -->
  <link rel="stylesheet" href="/kit/1/kit.css">
  <script type="module" src="/kit/1/kit.js"></script>
  <!-- The CSP forbids inline scripts: view logic lives in an external module. -->
  <script type="module" src="view.js"></script>
</head>
<body>
<rc-page>
  <rc-header id="header" heading="Today"></rc-header>

  <!-- Shown only while the plan is empty (day zero, or before the coach has written a plan). -->
  <rc-empty id="onboarding" hidden icon="chat" heading="Your coach will fill this in">
    After your first chat, today's session shows up here.
    <rc-button id="say-hi" variant="primary" icon="chat">Say hi to your coach</rc-button>
  </rc-empty>

  <!-- 1. Today's session(s): one card per planned workout, built by view.js -->
  <section id="sessions" class="rc-stack" aria-label="Today's sessions"></section>

  <!-- 2. Readiness check-in shortcut -->
  <rc-card id="checkin-card" heading="Quick check-in" subheading="Helps your coach adjust the plan." hidden>
    <rc-button id="checkin-open" variant="secondary" icon="heart">How are you feeling?</rc-button>
    <rc-form id="checkin-form" submit-label="Save check-in" hidden></rc-form>
  </rc-card>

  <!-- 3. Last activity: view.js fills the attributes -->
  <rc-card id="last-card" heading="Last activity" hidden>
    <p id="last-title" class="rc-muted"></p>
    <div class="rc-grid" data-cols="3">
      <rc-stat id="last-distance" label="Distance" format="distance"></rc-stat>
      <rc-stat id="last-time" label="Time" format="duration"></rc-stat>
      <rc-stat id="last-pace" label="Pace" format="pace"></rc-stat>
    </div>
  </rc-card>

  <!-- 4. Next key session -->
  <rc-card id="next-card" heading="Next key session" hidden>
    <rc-list id="next" selectable></rc-list>
  </rc-card>
</rc-page>
</body>
</html>
