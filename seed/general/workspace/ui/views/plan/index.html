<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="Plan">Plan</title>
  <link rel="stylesheet" href="/kit/1/kit.css?v=0.3.7">
  <link rel="stylesheet" href="view.css">
  <script type="module" src="/kit/1/kit.js?v=0.3.7"></script>
  <script type="module" src="view.js"></script>
</head>
<body>
<rc-page>
  <rc-header heading="Plan" data-i18n-heading="Plan" subheading="Read-only. Ask your coach to change anything." data-i18n-subheading="Read-only. Ask your coach to change anything."></rc-header>

  <!-- Day zero: nothing to show yet. -->
  <rc-empty id="onboarding" hidden icon="plan" heading="Your coach will fill this in" data-i18n-heading="Your coach will fill this in"><span data-i18n="After your first chat you'll see your training block, weekly training and key sessions here.">After your first chat you'll see your training block, weekly training and key sessions here.</span><rc-button id="start-chat" variant="primary" icon="chat"><span data-i18n="Start the conversation">Start the conversation</span></rc-button>
  </rc-empty>

  <div id="content" class="rc-stack" hidden>
    <!-- Current block + where we are in it -->
    <rc-card id="block-card" hidden>
      <div class="block-head">
        <div class="rc-grow">
          <h2 id="block-name" class="rc-card__title"></h2>
          <p id="block-dates" class="rc-muted"></p>
          <p id="block-focus"></p>
        </div>
        <rc-progress-ring id="block-ring" size="88" label="weeks" data-i18n-label="weeks"></rc-progress-ring>
      </div>
      <!-- Phases timeline: a proportional bar plus an accessible list -->
      <div id="phase-bar" class="phase-bar" aria-hidden="true"></div>
      <rc-list id="phases"></rc-list>
    </rc-card>

    <!-- Weekly time is the volume measure that works across sports; bars stack by sport. -->
    <rc-card heading="Planned weekly training" data-i18n-heading="Planned weekly training">
      <rc-chart id="volume" type="bar" stacked y-format="duration" height="180"
        label="Planned training time per week" data-i18n-label="Planned training time per week" empty="No planned sessions in this period yet." data-i18n-empty="No planned sessions in this period yet."></rc-chart>
      <div class="table-wrap"><table id="weeks" class="plan-table"></table></div>
    </rc-card>

    <div class="rc-grid-wide">
    <section id="key-card" class="rc-stack-sm" aria-labelledby="key-heading" hidden>
      <h2 id="key-heading" class="rc-card__title" data-i18n="Key sessions">Key sessions</h2>
      <rc-list id="key-sessions" selectable></rc-list>
    </section>

    <section id="event-card" class="rc-stack-sm" aria-labelledby="event-heading" hidden>
      <h2 id="event-heading" class="rc-card__title" data-i18n="Next goal">Next goal</h2>
      <div id="event"></div>
    </section>

    </div>

    <!-- Athlete-facing explanation, kept separate from the coach's working notes. -->
    <rc-card heading="Why this plan" data-i18n-heading="Why this plan">
      <rc-markdown file="plan/athlete-summary.md" empty="Ask your coach to explain the purpose of this plan." data-i18n-empty="Ask your coach to explain the purpose of this plan."></rc-markdown>
    </rc-card>

    <rc-button id="discuss" variant="primary" icon="chat" block><span data-i18n="Discuss this plan">Discuss this plan</span></rc-button>
  </div>
</rc-page>
</body>
</html>
