<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="Calendar">Calendar</title>
  <link rel="stylesheet" href="/kit/1/kit.css">
  <link rel="stylesheet" href="view.css">
  <script type="module" src="/kit/1/kit.js"></script>
  <script type="module" src="view.js"></script>
</head>
<body>
<rc-page wide>
  <rc-header heading="Calendar" data-i18n-heading="Calendar">
    <!-- Children of <rc-header> become its action area. -->
    <rc-segmented id="mode" label="Calendar layout" data-i18n-label="Calendar layout" value="month" options='[{"value":"month","label":"Month"},{"value":"week","label":"Week"}]' data-i18n-options='[{"value":"month","label":"Month"},{"value":"week","label":"Week"}]'></rc-segmented>
  </rc-header>

  <!--
    One declarative component does the heavy lifting:
      sql          rows with the columns id, date, type, title, status (+ optional source, target_distance_m ...)
      movable      drag a planned session (or tap it, then "Move...") to another day
      write-target on a move, update that table's row (date, + write-status) through coach.db.write
      act-name     ...and tell the coach with coach.act('workout_moved', { id, from, to }, { wake: true })
    Only planned sessions are movable: activities and goal events are history/fixed (source = 'activity' | 'event').
    `type` is free text (a session type, a sport or an event kind); the kit gives every word a stable colour and letter.
  -->
  <rc-calendar id="cal" movable write-target="planned_workouts" write-status="moved" act-name="workout_moved"
    empty="Nothing here yet. Your coach will fill this in after your first chat." data-i18n-empty="Nothing here yet. Your coach will fill this in after your first chat."
    sql="SELECT id, date, type, title, status, 'planned' AS source, target_distance_m, target_duration_s FROM planned_workouts
         UNION ALL
         SELECT id, substr(started_at, 1, 10), sport, coalesce(title, sport), 'done', 'activity', distance_m, duration_s
           FROM activities WHERE planned_id IS NULL
         UNION ALL
         SELECT id, date, coalesce(kind, 'competition'), name, 'planned', 'event', distance_m, NULL FROM goal_events"></rc-calendar>

  <!-- Details of the tapped item, filled by view.js -->
  <rc-card id="detail" hidden></rc-card>

  <rc-card id="key-card" hidden heading="Key" data-i18n-heading="Key" subheading="Colour and letter show the type. Solid means done." data-i18n-subheading="Colour and letter show the type. Solid means done.">
    <ul class="key" id="key"></ul>
  </rc-card>
</rc-page>
</body>
</html>
