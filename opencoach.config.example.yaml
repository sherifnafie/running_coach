# Copy to opencoach.config.yaml. Credentials belong in environment variables.
dataDir: ./.data
host: 0.0.0.0
port: 8080
viewsPort: 8081
publicUrl: http://localhost:8080
viewsUrl: http://localhost:8081
logLevel: info
sandbox:
  provider: local
  allowUnsafe: false
# With no model keys the scripted demo is selected automatically.
# OPENROUTER_API_KEY alone selects the default catalog model for every tier.
# providers:
#   openrouter:
#     defaultModel: deepseek/deepseek-v4.1-flash
#     deepModel: deepseek/deepseek-v4.1-flash
#     routing: { dataCollection: deny, requireParameters: true }
# Override models.tiers to use another model or an OpenAI-compatible endpoint.
# providers:
#   compatible:
#     - id: local
#       baseUrl: http://localhost:11434/v1
#       vision: false
# models:
#   tiers:
#     coach: { provider: local, model: your-model }
#     fast: { provider: local, model: your-model }
#     deep: { provider: local, model: your-model }
web:
  search: { provider: none }
  fetch: { enabled: true }
push:
  vapidSubject: mailto:admin@example.com
# mcp:
#   servers:
#     - name: example
#       transport: http
#       url: https://your-mcp-server.example/mcp
#       allowTools: [search]
#       helpers: false

# Small images reuse OpenRouter keys by default; no separate image key needed.
# OPENCOACH_IMAGES_ENABLED=false disables the service. See docs/self-hosting.md.
# Model, size, count and quality are server controls, not coach arguments.
# imageGeneration:
#   provider: openrouter
#   model: openai/gpt-image-2.5-flare
#   quality: medium
#   costPerImageUsd: 0.02 # reservation ceiling, not a promised provider invoice
#   timeoutMs: 120000
